{% extends "layout.html" %}

{% block title %}
    Account
{% endblock %}

{% block main %}

    <div class="container">
        <div class="row g-4">

            <!-- Change Username -->
            <div class="col-12 col-md-4">
                <div class="card h-100">
                    <div class="card-body">
                        <h4 class="card-title">Change Username</h4>

                        <p class="text-muted">
                            Current username: {{ username }}
                        </p>

                        <form action="/newusername" method="post">

                            <div class="mb-3">
                                <label for="username" class="form-label">
                                    New Username
                                </label>

                                <input
                                    autocomplete="off"
                                    class="form-control"
                                    id="username"
                                    name="username"
                                    type="text">
                            </div>

                            <div class="mb-3">
                                <label for="username_password" class="form-label">
                                    Password
                                </label>

                                <input
                                    class="form-control"
                                    id="username_password"
                                    name="password"
                                    type="password">
                            </div>

                            <button
                                class="btn btn-primary w-100"
                                type="submit">
                                Change Username
                            </button>

                        </form>

                    </div>
                </div>
            </div>

            <!-- Change Password -->
            <div class="col-12 col-md-4">
                <div class="card h-100">
                    <div class="card-body">

                        <h4 class="card-title">Change Password</h4>

                        <form action="/newpassword" method="post">

                            <div class="mb-3">
                                <label for="current_password" class="form-label">
                                    Current Password
                                </label>

                                <input
                                    class="form-control"
                                    id="current_password"
                                    name="password"
                                    type="password">
                            </div>

                            <div class="mb-3">
                                <label for="newpassword" class="form-label">
                                    New Password
                                </label>

                                <input
                                    class="form-control"
                                    id="newpassword"
                                    name="newpassword"
                                    type="password">
                            </div>

                            <div class="mb-3">
                                <label for="confirmation" class="form-label">
                                    Confirm New Password
                                </label>

                                <input
                                    class="form-control"
                                    id="confirmation"
                                    name="confirmation"
                                    type="password">
                            </div>

                            <button
                                class="btn btn-primary w-100"
                                type="submit">
                                Change Password
                            </button>

                        </form>

                    </div>
                </div>
            </div>

            <!-- Delete Account -->
            <div class="col-12 col-md-4">
                <div class="card border-danger h-100">
                    <div class="card-body">

                        <h4 class="card-title text-danger">
                            Delete Account
                        </h4>

                        <p class="text-muted">
                            This action cannot be undone.
                        </p>

                        <form action="/deleteuser" method="post">

                            <div class="mb-3">
                                <label for="delete_password" class="form-label">
                                    Password
                                </label>

                                <input
                                    class="form-control"
                                    id="delete_password"
                                    name="password"
                                    type="password">
                            </div>

                            <button
                                class="btn btn-danger w-100"
                                type="submit"
                                onclick="return confirm('Are you sure you want to permanently delete your account?');">
                                Delete Account
                            </button>

                        </form>

                    </div>
                </div>
            </div>

        </div>
    </div>

{% endblock %}
