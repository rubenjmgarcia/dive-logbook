{% extends "layout.html" %}

{% block title %}
    Update Dive #{{ dive.number }}
{% endblock %}

{% block main %}

    <h1>Update Dive #{{ dive.number }}</h1>

    <form action="/update_dive" method="post">

        <input type="hidden" name="id" value="{{ dive.id }}">

        <div class="mb-3">
            <label for="number" class="form-label">Dive Number</label>
            <input
                class="form-control"
                id="number"
                name="number"
                type="number"
                value="{{ dive.number }}"
                required>
        </div>

        <div class="mb-3">
            <label for="datetime" class="form-label">Date and Time</label>
            <input
                class="form-control"
                id="datetime"
                name="datetime"
                type="datetime-local"
                value="{{ dive.datetime }}"
                required>
        </div>

        <div class="mb-3">
            <label for="divesite_id" class="form-label">Dive Site</label>

            <select
                class="form-select"
                id="divesite_id"
                name="divesite_id"
                required>

                {% for site in divesites %}
                    <option
                        value="{{ site.id }}"
                        {% if site.id == dive.divesite_id %}selected{% endif %}>
                        {{ site.divesite }}
                    </option>
                {% endfor %}

            </select>
        </div>


        <div class="mb-3">
            <label for="dive_time" class="form-label">Dive Time (min)</label>
            <input
                class="form-control"
                id="dive_time"
                name="dive_time"
                type="number"
                min="1"
                max="180"
                value="{{ dive.dive_time }}"
                required>
        </div>

        <div class="mb-3">
            <label for="max_depth" class="form-label">Max Depth (m)</label>
            <input
                class="form-control"
                id="max_depth"
                name="max_depth"
                type="number"
                step="0.1"
                value="{{ dive.max_depth }}"
                required>
        </div>

        <div class="mb-3">
            <label for="av_depth" class="form-label">Average Depth (m)</label>
            <input
                class="form-control"
                id="av_depth"
                name="av_depth"
                type="number"
                step="0.1"
                value="{{ dive.av_depth or '' }}">
        </div>

        <div class="mb-3">
            <label for="start_pressure" class="form-label">Start Pressure (bar)</label>
            <input
                class="form-control"
                id="start_pressure"
                name="start_pressure"
                type="number"
                value="{{ dive.start_pressure or '' }}">
        </div>

        <div class="mb-3">
            <label for="end_pressure" class="form-label">End Pressure (bar)</label>
            <input
                class="form-control"
                id="end_pressure"
                name="end_pressure"
                type="number"
                value="{{ dive.end_pressure or '' }}">
        </div>

        <div class="mb-3">
            <label for="volume" class="form-label">Tank Volume (L)</label>
            <input
                class="form-control"
                id="volume"
                name="volume"
                type="number"
                step="0.1"
                value="{{ dive.volume }}">
        </div>

        <div class="mb-3">
            <label for="water_temp" class="form-label">Water Temperature (°C)</label>
            <input
                class="form-control"
                id="water_temp"
                name="water_temp"
                type="number"
                value="{{ dive.water_temp or '' }}">
        </div>

        <div class="mb-3">
            <label for="visibility" class="form-label">Visibility (m)</label>
            <input
                class="form-control"
                id="visibility"
                name="visibility"
                type="number"
                value="{{ dive.visibility or '' }}">
        </div>

        <div class="mb-3">
            <label for="notes" class="form-label">Notes</label>
            <textarea
                class="form-control"
                id="notes"
                name="notes"
                rows="4">{{ dive.notes or '' }}</textarea>
        </div>

        <button class="btn btn-primary" type="submit">
            Save Changes
        </button>

    </form>

{% endblock %}
