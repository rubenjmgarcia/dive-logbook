{% extends "layout.html" %}

{% block title %}
    Add Dive Site
{% endblock %}

{% block main %}

        <div class="mb-3">
            <input class="form-control" id="dive_site" name="dive_site" type="text" placeholder="Dive Site Name" required>

            Save Dive Site

    </form>
{% endblock %}
